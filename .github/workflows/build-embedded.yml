name: Build Dota Lobby Overlay (embedded NetHook)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/embedded-memory-capture
    paths:
      - 'DotaLobbyOverlay/**'
      - 'build/**'
      - '.github/workflows/build-embedded.yml'

concurrency:
  group: dota-lobby-overlay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      # Protobuf 3.15.8 can fail under parallel MSVC compilation on the hosted runner.
      VCPKG_MAX_CONCURRENCY: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      CL_MPCount: 1
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Checkout NetHook2 source
        uses: actions/checkout@v4
        with:
          repository: SteamRE/SteamKit
          path: third_party/SteamKit

      - name: Patch NetHook2 for in-memory delivery
        shell: pwsh
        run: ./build/patch-nethook-memory.ps1 -SteamKitRoot ./third_party/SteamKit

      - name: Prepare native dependencies
        shell: pwsh
        working-directory: third_party/SteamKit/Resources/NetHook2
        run: ./SetupDependencies.ps1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate managed project before native build
        shell: pwsh
        run: dotnet build DotaLobbyOverlay/DotaLobbyOverlay.csproj -c Release -p:Platform=x64

      - name: Build NetHook2 x64
        shell: pwsh
        run: |
          # Build from a SUBST drive so MSVC/vcpkg/CMake never see the long GitHub workspace path.
          if (Test-Path R:\) { subst R: /d }
          subst R: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Failed to map workspace to R:" }
          Set-Location R:\
          $env:VCPKG_OVERLAY_TRIPLETS = 'R:\build\vcpkg-triplets'
          $shortVcpkgInstall = 'R:\vcpkg_installed'
          msbuild R:\third_party\SteamKit\Resources\NetHook2\NetHook2.sln /m:1 /p:Configuration=Release /p:Platform=x64 /p:CL_MPCount=1 "/p:VcpkgInstalledDir=$shortVcpkgInstall"
          $nativeDll = "R:\third_party\SteamKit\Resources\NetHook2\x64\Release\NetHook2.dll"
          if (!(Test-Path $nativeDll)) {
            Get-ChildItem third_party/SteamKit/Resources/NetHook2 -Filter NetHook2.dll -Recurse | Select-Object FullName
            throw "NetHook2.dll was not produced at expected path: $nativeDll"
          }
          New-Item -ItemType Directory -Force R:\DotaLobbyOverlay\artifacts | Out-Null
          Copy-Item $nativeDll R:\DotaLobbyOverlay\artifacts\NetHook2.dll -Force

      - name: Publish self-contained EXE
        shell: pwsh
        run: dotnet publish DotaLobbyOverlay/DotaLobbyOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DotaLobbyOverlay-win-x64
          path: publish/DotaLobbyOverlay.exe
          if-no-files-found: error
